<div
  style="
    font-family: Arial, sans-serif;
    max-width: 600px;
    margin: 40px auto;
    border: 1px solid #eee;
    border-radius: 8px;
    overflow: hidden;
    color: #333;
  "
>
  <div style="background-color: #000; padding: 30px 20px; text-align: center">
    <h1 style="color: #c5a25d; margin: 0; font-size: 24px">Opium Greece</h1>
  </div>

  <div style="padding: 40px 30px">
    <h2 style="margin-top: 0; margin-bottom: 20px">Verify your account</h2>

    <p style="margin-bottom: 30px; line-height: 1.6">
      Thanks for joining! Please click the button below to verify your email
      address and start your journey with us.
    </p>

    <div style="text-align: center; margin: 40px 0">
      <a
        href="{{URL}}"
        style="
          display: inline-block;
          background-color: #c5a25d;
          color: #fff;
          padding: 15px 30px;
          border-radius: 5px;
          text-decoration: none;
          font-weight: bold;
          font-size: 16px;
        "
      >
        Verify Email
      </a>
    </div>

    <p
      style="
        margin-top: 30px;
        font-size: 12px;
        color: #888;
        border-top: 1px solid #eee;
        padding-top: 20px;
      "
    >
      If you did not request this, you can safely ignore this email.
    </p>
  </div>
</div>
